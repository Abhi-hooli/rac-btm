<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Rotaract Bengaluru BTM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8f9fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      border: 1px solid #eee;
    }
    .logo { width: 120px; height: 48px; object-fit: contain; margin: 0 auto 32px; display: block; }
    .code { font-size: 72px; font-weight: 800; color: #D31145; line-height: 1; margin-bottom: 8px; }
    .title { font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
    .desc { font-size: 14px; color: #888; line-height: 1.6; margin-bottom: 32px; }
    .btn {
      display: inline-block;
      background: #D31145;
      color: #fff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .footer { margin-top: 24px; font-size: 12px; color: #bbb; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/rotaract-logo.png" alt="Rotaract BTM" class="logo" onerror="this.style.display='none'" />
    <div class="code">404</div>
    <div class="title">Page not found</div>
    <div class="desc">The page you're looking for doesn't exist or has been moved.</div>
    <a href="/" class="btn">← Back to Home</a>
    <div class="footer">Rotaract Club of Bengaluru BTM · RID 3191</div>
  </div>
</body>
</html>
